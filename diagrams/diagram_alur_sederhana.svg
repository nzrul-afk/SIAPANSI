<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <style>
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
      .step-num-green { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #166534; letter-spacing: 0.5px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .arrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1000" height="200" fill="#ffffff" rx="8"/>

  <!-- Box 1 -->
  <g transform="translate(20, 40)">
    <rect width="210" height="120" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <text x="105" y="32" class="step-num" text-anchor="middle">TAHAP 1</text>
    <text x="105" y="62" class="title">Input Data</text>
    <text x="105" y="86" class="desc">Stok Lumbung &amp; Penduduk</text>
  </g>

  <text x="255" y="100" class="arrow">→</text>

  <!-- Box 2 -->
  <g transform="translate(275, 40)">
    <rect width="210" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="105" y="32" class="step-num-green" text-anchor="middle">TAHAP 2</text>
    <text x="105" y="62" class="title">Analisis AI</text>
    <text x="105" y="86" class="desc">Prediksi Ketahanan Pangan</text>
  </g>

  <text x="510" y="100" class="arrow">→</text>

  <!-- Box 3 -->
  <g transform="translate(530, 40)">
    <rect width="210" height="120" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <text x="105" y="32" class="step-num" text-anchor="middle">TAHAP 3</text>
    <text x="105" y="62" class="title">Dashboard EWS</text>
    <text x="105" y="86" class="desc">Status &amp; Peringatan Dini</text>
  </g>

  <text x="765" y="100" class="arrow">→</text>

  <!-- Box 4 -->
  <g transform="translate(785, 40)">
    <rect width="195" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="97" y="32" class="step-num-green" text-anchor="middle">TAHAP 4</text>
    <text x="97" y="62" class="title">Aksi Lapangan</text>
    <text x="97" y="86" class="desc">Bantuan &amp; Barter Antar-Desa</text>
  </g>
</svg>
