<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 480" width="1260" height="480">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .badge-txt { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .card-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      .card-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #334155; }
      .card-body-b { font-weight: 700; }
      .footer-txt { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }
      .arrow { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1260" height="480" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="510" y="20" width="240" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="620" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle" letter-spacing="1">CARA KERJA SISTEM SIAPANSA</text>
  <text x="620" y="68" class="title">Diagram Alur Integrasi Ketahanan Pangan Desa</text>
  <text x="620" y="88" class="subtitle">Dari Pencatatan Multikanal hingga Eksekusi Intervensi &amp; Logistik Antar-Desa</text>

  <!-- CARD 1 -->
  <g transform="translate(30, 115)">
    <rect width="270" height="335" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#334155"/>
    <text x="24" y="31" class="badge-txt">TAHAP 01</text>
    <text x="16" y="62" class="card-title">Input &amp; Pengumpulan Data</text>
    <text x="16" y="80" class="card-sub">Pencatatan multikanal lumbung desa</text>
    
    <text x="16" y="112" class="card-body">
      <tspan fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Stok Lumbung Desa:</tspan>
      <tspan x="26" dy="16">Mutasi stok masuk &amp; keluar</tspan>
      <tspan x="26" dy="15">(Online / Offline SQLite).</tspan>
      
      <tspan x="16" dy="26" fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Demografi Penduduk:</tspan>
      <tspan x="26" dy="16">Jumlah jiwa &amp; standar</tspan>
      <tspan x="26" dy="15">konsumsi AKG Kemenkes.</tspan>
      
      <tspan x="16" dy="26" fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Agregasi Data Luar:</tspan>
      <tspan x="26" dy="16">Pantauan cuaca BMKG &amp;</tspan>
      <tspan x="26" dy="15">fluktuasi harga pasar pangan.</tspan>
    </text>

    <line x1="16" y1="295" x2="254" y2="295" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="16" y="318" class="footer-txt" fill="#475569">Basis Data Siapansa</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <circle cx="318" cy="282" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="318" y="282" class="arrow">➔</text>

  <!-- CARD 2 -->
  <g transform="translate(336, 115)">
    <rect width="270" height="335" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#059669"/>
    <text x="24" y="31" class="badge-txt">TAHAP 02</text>
    <text x="16" y="62" class="card-title">Mesin Analisis AI &amp; EWS</text>
    <text x="16" y="80" class="card-sub">Komputasi &amp; proyeksi prediktif</text>
    
    <text x="16" y="112" class="card-body">
      <tspan fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Days of Coverage (DoC):</tspan>
      <tspan x="26" dy="16">Hitung hari bertahan pangan</tspan>
      <tspan x="26" dy="15">(Stok ÷ Kebutuhan/Hari).</tspan>
      
      <tspan x="16" dy="26" fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Kurasi Berita AI:</tspan>
      <tspan x="26" dy="16">Analisis tren sentimen &amp;</tspan>
      <tspan x="26" dy="15">korelasi harga komoditas.</tspan>
      
      <tspan x="16" dy="26" fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Skor Risiko &amp; Titik Lemah:</tspan>
      <tspan x="26" dy="16">Deteksi dini potensi krisis &amp;</tspan>
      <tspan x="26" dy="15">proyeksi tanggal stok habis.</tspan>
    </text>

    <line x1="16" y1="295" x2="254" y2="295" stroke="#a7f3d0" stroke-dasharray="3,3"/>
    <text x="16" y="318" class="footer-txt" fill="#047857">Algoritma Analitis &amp; AI</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <circle cx="624" cy="282" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="624" y="282" class="arrow">➔</text>

  <!-- CARD 3 -->
  <g transform="translate(642, 115)">
    <rect width="270" height="335" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#2563eb"/>
    <text x="24" y="31" class="badge-txt">TAHAP 03</text>
    <text x="16" y="62" class="card-title">Dashboard &amp; Peringatan</text>
    <text x="16" y="80" class="card-sub">Pusat visualisasi pengambil keputusan</text>
    
    <text x="16" y="112" class="card-body">
      <tspan fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Status Ketahanan:</tspan>
      <tspan x="26" dy="16">Indikator visual real-time</tspan>
      <tspan x="26" dy="15">(Aman, Waspada, Kritis).</tspan>
      
      <tspan x="16" dy="26" fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Indeks Ketahanan (IKP):</tspan>
      <tspan x="26" dy="16">Skor komposit gabungan</tspan>
      <tspan x="26" dy="15">ketahanan pangan desa.</tspan>
      
      <tspan x="16" dy="26" fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Rekomendasi Cerdas:</tspan>
      <tspan x="26" dy="16">Arahan taktis siap eksekusi</tspan>
      <tspan x="26" dy="15">bagi Kepala Desa &amp; aparat.</tspan>
    </text>

    <line x1="16" y1="295" x2="254" y2="295" stroke="#bfdbfe" stroke-dasharray="3,3"/>
    <text x="16" y="318" class="footer-txt" fill="#1d4ed8">Early Warning System (EWS)</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <circle cx="930" cy="282" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="930" y="282" class="arrow">➔</text>

  <!-- CARD 4 -->
  <g transform="translate(948, 115)">
    <rect width="270" height="335" rx="14" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#d97706"/>
    <text x="24" y="31" class="badge-txt">TAHAP 04</text>
    <text x="16" y="62" class="card-title">Aksi &amp; Logistik Desa</text>
    <text x="16" y="80" class="card-sub">Intervensi terpadu lapangan</text>
    
    <text x="16" y="112" class="card-body">
      <tspan fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Operasi Pasar Murah:</tspan>
      <tspan x="26" dy="16">Pengendalian harga &amp; pasokan</tspan>
      <tspan x="26" dy="15">cadangan lumbung desa.</tspan>
      
      <tspan x="16" dy="26" fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Kolaborasi Antar-Desa:</tspan>
      <tspan x="26" dy="16">Barter surplus Beras (Desa</tspan>
      <tspan x="26" dy="15">Sumber Rejo ↔ Sayur Tumpakrejo).</tspan>
      
      <tspan x="16" dy="26" fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Stabilisasi Berkelanjutan:</tspan>
      <tspan x="26" dy="16">Pemberantasan defisit lokal</tspan>
      <tspan x="26" dy="15">tanpa ketergantungan luar.</tspan>
    </text>

    <line x1="16" y1="295" x2="254" y2="295" stroke="#fde68a" stroke-dasharray="3,3"/>
    <text x="16" y="318" class="footer-txt" fill="#b45309">Eksekusi Lapangan &amp; Solusi</text>
  </g>
</svg>
