<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900">
  <defs>
    <style>
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
      .stage-num-green { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #166534; letter-spacing: 0.5px; }
      .stage-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #334155; }
      .bold-txt { font-weight: 600; fill: #0f172a; }
      .arrow-v { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; fill: #94a3b8; text-anchor: middle; }
    </style>
  </defs>

  <rect width="760" height="900" fill="#ffffff" rx="12" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="44" class="txt-title">Diagram Alur Sistem SIAPANSA</text>
  <text x="28" y="66" class="txt-sub">Arsitektur Operasional: Dari Pencatatan Lumbung, Analisis Komputasi AI, hingga Logistik Antar-Desa</text>
  <line x1="28" y1="84" x2="732" y2="84" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Stage 1 -->
  <g transform="translate(28, 104)">
    <rect width="704" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="32" class="stage-num">TAHAP 1</text>
    <text x="110" y="32" class="stage-head">Pengumpulan Data Lumbung</text>
    
    <text x="110" y="60" class="body-txt">
      <tspan fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Stok Komoditas:</tspan> Mutasi pangan masuk &amp; keluar (mendukung offline SQLite).
      <tspan x="110" dy="22" fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Demografi Penduduk:</tspan> Jumlah jiwa desa &amp; norma konsumsi AKG (300 g/hari).
      <tspan x="110" dy="22" fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Data Eksternal:</tspan> Prakiraan cuaca BMKG &amp; pembaruan tren harga pasar komoditas.
    </text>
  </g>

  <text x="380" y="280" class="arrow-v">↓</text>

  <!-- Stage 2 (Highlight Green) -->
  <g transform="translate(28, 298)">
    <rect width="704" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="32" class="stage-num-green">TAHAP 2</text>
    <text x="110" y="32" class="stage-head">Komputasi AI &amp; Analisis Kerentanan</text>

    <text x="110" y="60" class="body-txt">
      <tspan fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Days of Coverage (DoC):</tspan> Menghitung daya tahan stok (Stok ÷ Kebutuhan Harian Jiwa).
      <tspan x="110" dy="22" fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Kurasi Berita AI:</tspan> Pemetaan sentimen pasokan pasar &amp; risiko gagal panen cuaca.
      <tspan x="110" dy="22" fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Deteksi Dini:</tspan> Identifikasi titik terlemah lumbung &amp; estimasi tanggal kritis.
    </text>
  </g>

  <text x="380" y="474" class="arrow-v">↓</text>

  <!-- Stage 3 -->
  <g transform="translate(28, 492)">
    <rect width="704" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="32" class="stage-num">TAHAP 3</text>
    <text x="110" y="32" class="stage-head">Visualisasi Dashboard EWS</text>

    <text x="110" y="60" class="body-txt">
      <tspan fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Status Ketahanan:</tspan> Indikator visual status desa (Aman >30 hari, Waspada, Kritis).
      <tspan x="110" dy="22" fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Skor IKP Desa:</tspan> Nilai komposit Indeks Ketahanan Pangan wilayah.
      <tspan x="110" dy="22" fill="#64748b" font-weight="bold">– </tspan><tspan class="bold-txt">Arahan Taktis:</tspan> Rekomendasi terstruktur untuk pengambilan keputusan Kepala Desa.
    </text>
  </g>

  <text x="380" y="668" class="arrow-v">↓</text>

  <!-- Stage 4 (Highlight Green) -->
  <g transform="translate(28, 686)">
    <rect width="704" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="32" class="stage-num-green">TAHAP 4</text>
    <text x="110" y="32" class="stage-head">Eksekusi Logistik Antar-Desa</text>

    <text x="110" y="60" class="body-txt">
      <tspan fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Intervensi Lokal:</tspan> Operasi pasar murah &amp; pelepasan cadangan darurat lumbung.
      <tspan x="110" dy="22" fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Barter Bilateral:</tspan> Pertukaran surplus Beras Sumber Rejo ↔ Sayur Tumpakrejo.
      <tspan x="110" dy="22" fill="#16a34a" font-weight="bold">– </tspan><tspan class="bold-txt">Stabilisasi Pasokan:</tspan> Pemulihan cadangan pangan menuju keseimbangan wilayah.
    </text>
  </g>
</svg>
