<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 920" width="740" height="920">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .badge-txt { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .card-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      .card-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #334155; }
      .card-body-b { font-weight: 700; }
      .arrow { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="740" height="920" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="250" y="22" width="240" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="370" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle" letter-spacing="1">CARA KERJA SISTEM SIAPANSA</text>
  <text x="370" y="70" class="title">Diagram Alur Integrasi Ketahanan Pangan Desa</text>
  <text x="370" y="90" class="subtitle">Pencatatan Multikanal ➔ Mesin AI ➔ Dashboard EWS ➔ Logistik Antar-Desa</text>

  <!-- CARD 1 -->
  <g transform="translate(35, 115)">
    <rect width="670" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="20" width="80" height="24" rx="6" fill="#334155"/>
    <text x="28" y="36" class="badge-txt">TAHAP 01</text>
    
    <text x="120" y="36" class="card-title">Input &amp; Pengumpulan Data Lumbung</text>
    <text x="120" y="54" class="card-sub">Pencatatan multikanal lumbung desa</text>

    <text x="120" y="80" class="card-body">
      <tspan fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Stok Lumbung Desa:</tspan> Pencatatan mutasi pangan masuk/keluar (Online / Offline SQLite).
      <tspan x="120" dy="20" fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Demografi Penduduk:</tspan> Jumlah jiwa desa &amp; standar konsumsi AKG Kemenkes RI.
      <tspan x="120" dy="20" fill="#475569" font-weight="bold">• </tspan><tspan class="card-body-b">Agregasi Data Eksternal:</tspan> Integrasi data cuaca BMKG &amp; fluktuasi harga pasar komoditas.
    </text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <circle cx="370" cy="285" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="370" y="285" class="arrow">▼</text>

  <!-- CARD 2 -->
  <g transform="translate(35, 305)">
    <rect width="670" height="150" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="20" width="80" height="24" rx="6" fill="#059669"/>
    <text x="28" y="36" class="badge-txt">TAHAP 02</text>
    
    <text x="120" y="36" class="card-title">Mesin Analisis AI &amp; EWS</text>
    <text x="120" y="54" class="card-sub">Komputasi &amp; proyeksi prediktif ketahanan pangan</text>

    <text x="120" y="80" class="card-body">
      <tspan fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Days of Coverage (DoC):</tspan> Menghitung daya tahan stok pangan (Stok ÷ Kebutuhan Harian).
      <tspan x="120" dy="20" fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Analisis Berita AI:</tspan> Kurasi berita pasar &amp; sintesis dampak risiko pangan lokal secara otomatis.
      <tspan x="120" dy="20" fill="#059669" font-weight="bold">• </tspan><tspan class="card-body-b">Deteksi Dini Kerentanan:</tspan> Identifikasi titik terlemah lumbung &amp; estimasi tanggal stok kritis.
    </text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <circle cx="370" cy="475" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="370" y="475" class="arrow">▼</text>

  <!-- CARD 3 -->
  <g transform="translate(35, 495)">
    <rect width="670" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="20" width="80" height="24" rx="6" fill="#2563eb"/>
    <text x="28" y="36" class="badge-txt">TAHAP 03</text>
    
    <text x="120" y="36" class="card-title">Dashboard &amp; Peringatan Dini</text>
    <text x="120" y="54" class="card-sub">Pusat visualisasi pengambil keputusan pemerintah desa</text>

    <text x="120" y="80" class="card-body">
      <tspan fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Status Pangan Real-Time:</tspan> Label visual status pangan desa (Aman, Waspada, atau Kritis).
      <tspan x="120" dy="20" fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Indeks Ketahanan (IKP):</tspan> Skor komposit ketahanan pangan desa berbasis indikator terpadu.
      <tspan x="120" dy="20" fill="#2563eb" font-weight="bold">• </tspan><tspan class="card-body-b">Rekomendasi Kebijakan:</tspan> Arahan mitigasi taktis instan bagi Kepala Desa &amp; aparat desa.
    </text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <circle cx="370" cy="665" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="370" y="665" class="arrow">▼</text>

  <!-- CARD 4 -->
  <g transform="translate(35, 685)">
    <rect width="670" height="150" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="20" width="80" height="24" rx="6" fill="#d97706"/>
    <text x="28" y="36" class="badge-txt">TAHAP 04</text>
    
    <text x="120" y="36" class="card-title">Aksi Lapangan &amp; Logistik Antar-Desa</text>
    <text x="120" y="54" class="card-sub">Eksekusi intervensi logistik pangan terpadu</text>

    <text x="120" y="80" class="card-body">
      <tspan fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Intervensi Cadangan:</tspan> Operasi pasar murah &amp; penyaluran stok darurat lumbung desa.
      <tspan x="120" dy="20" fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Barter Bilateral Antar-Desa:</tspan> Surplus Beras Sumber Rejo ↔ Surplus Sayur Tumpakrejo.
      <tspan x="120" dy="20" fill="#d97706" font-weight="bold">• </tspan><tspan class="card-body-b">Keseimbangan Wilayah:</tspan> Menjamin ketahanan pangan berkelanjutan tanpa kelangkaan.
    </text>
  </g>
</svg>
